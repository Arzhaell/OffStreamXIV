<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <!-- Icône du plugin : le cadre d'une caméra qui filme (ce que voit le stream), une fenêtre de plugin, et un œil barré :
       la fenêtre est là pour toi, pas pour le stream. -->
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#22324f"/>
      <stop offset="1" stop-color="#101827"/>
    </linearGradient>
    <linearGradient id="titlebar" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#73ccff"/>
      <stop offset="1" stop-color="#3d7fd1"/>
    </linearGradient>
    <linearGradient id="badge" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f0794b"/>
      <stop offset="1" stop-color="#d63f3a"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="9" flood-color="#000" flood-opacity="0.45"/>
    </filter>
  </defs>

  <!-- Fond -->
  <rect x="8" y="8" width="496" height="496" rx="104" fill="url(#background)"/>

  <!-- Cadre de la caméra (coins) et voyant d'enregistrement -->
  <g fill="none" stroke="#73ccff" stroke-width="14" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 72 136 V 72 H 136"/>
    <path d="M 376 72 H 440 V 136"/>
    <path d="M 440 376 V 440 H 376"/>
    <path d="M 136 440 H 72 V 376"/>
  </g>
  <circle cx="404" cy="108" r="14" fill="#e5534b"/>

  <!-- Fenêtre de plugin -->
  <g transform="rotate(-6 236 250)" filter="url(#shadow)">
    <rect x="112" y="142" width="248" height="204" rx="16" fill="#f4f1ea"/>
    <path d="M 112 158 A 16 16 0 0 1 128 142 H 344 A 16 16 0 0 1 360 158 V 184 H 112 Z" fill="url(#titlebar)"/>
    <circle cx="300" cy="163" r="7" fill="#e8f6ff"/>
    <circle cx="326" cy="163" r="7" fill="#e8f6ff"/>
    <rect x="136" y="208" width="150" height="14" rx="7" fill="#b9c3d6"/>
    <rect x="136" y="238" width="196" height="14" rx="7" fill="#b9c3d6"/>
    <rect x="136" y="268" width="124" height="14" rx="7" fill="#b9c3d6"/>
    <rect x="136" y="298" width="170" height="14" rx="7" fill="#b9c3d6"/>
  </g>

  <!-- Œil barré : caché au stream -->
  <g filter="url(#shadow)">
    <circle cx="354" cy="354" r="92" fill="url(#badge)"/>
  </g>
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M 292 354 Q 354 296 416 354 Q 354 412 292 354 Z" stroke="#fff" stroke-width="13"/>
    <circle cx="354" cy="354" r="17" fill="#fff" stroke="none"/>
    <path d="M 314 314 L 394 394" stroke="#d63f3a" stroke-width="26"/>
    <path d="M 314 314 L 394 394" stroke="#fff" stroke-width="12"/>
  </g>
</svg>
